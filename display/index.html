<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>The room's questions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;500&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,rgba(0,212,255,.15),transparent 45%),radial-gradient(circle at bottom right,rgba(157,78,221,.18),transparent 42%),radial-gradient(circle at top right,rgba(192,38,211,.12),transparent 50%),#0b0f20;color:#f8f7ff;font-family:Roboto,"Helvetica Neue",Arial,sans-serif}main{min-height:100vh;padding:5vh 6vw;display:flex;flex-direction:column}header,footer{display:flex;justify-content:space-between;gap:24px;align-items:center}header{font-size:clamp(22px,2.2vw,36px);color:#00D4FF}.lead{display:flex;align-items:center;gap:28px}.brand{display:inline-flex;align-items:center;gap:14px;padding:8px 18px 8px 8px;background:rgba(255,255,255,.03);border-radius:12px;color:#fff;font:700 1em Montserrat,"Helvetica Neue",Arial,sans-serif;letter-spacing:.08em}.brand img{width:1.6em;height:1.6em}a{color:inherit}article{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1500px;margin:auto 0;padding:4vh 0}h1{font-family:Montserrat,"Helvetica Neue",Arial,sans-serif;font-weight:600;color:#fff;font-size:clamp(30px,3.1vw,54px);line-height:1.18;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 28px}#answer{font-size:clamp(28px,2.5vw,42px);line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;color:rgba(248,247,255,.88)}footer{font-size:clamp(18px,1.5vw,26px);color:rgba(248,247,255,.8)}button{font:inherit;color:inherit;background:transparent;border:1px solid rgba(0,212,255,.3);border-radius:999px;padding:8px 16px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #00D4FF;outline-offset:5px}#warning{color:#facc15}#fallback{font-size:20px;color:rgba(248,247,255,.7)}#blank{position:fixed;inset:0;background:#0b0f20;z-index:5}#blank[hidden]{display:none}@media(max-width:700px){header,footer{flex-wrap:wrap}main{padding:24px}h1{font-size:30px}#answer{font-size:28px}}
</style>
<main>
<header><span class="lead"><span class="brand"><img src="aigentic-logo.svg" alt="">AIGENTIC</span><span id="title">The room's questions</span></span><a href="https://ask-the-room-omega.vercel.app">ask-the-room-omega.vercel.app</a></header>
<p id="fallback" hidden>Prepared fallback</p>
<article><h1 id="message">Your question goes here</h1><p id="answer">Scan the code on the arrival slide and send a question or an idea.</p></article>
<footer><span id="state" role="status">Connecting…</span><span id="warning" role="status"></span><span><button id="previous" aria-label="Previous question">←</button> <button id="pause">Pause</button> <button id="next" aria-label="Next question">→</button></span><a href="https://github.com/dalet4/ask-the-room">Get the workflow</a></footer>
</main><div id="blank" hidden></div>
<script>
const params=new URLSearchParams(location.search),intake=params.has('intake');
document.querySelector('#fallback').hidden=!params.has('fallback');
document.querySelector('#title').textContent=intake?'Your questions and ideas':"The room's own agent";
const url='https://ivnmtkdxduxjgztjlfzs.supabase.co/rest/v1/demo_submissions?select=id,created_at,message,status,answer,answered_at&status=eq.approved&order=created_at.desc&limit=6';
const key='sb_publishable_OAyBkfyfj18XWhD4LWoRkg_bILEyBxm';
let rows=[],index=0,paused=false;
function show(){
 const row=rows[index];
 document.querySelector('#message').textContent=row?row.message:'Your question goes here';
 document.querySelector('#answer').textContent=row?(intake?'':row.answer||'Waiting for an answer…'):'Scan the code on the arrival slide and send a question or an idea.';
 document.querySelector('#state').textContent=rows.length?`${index+1} of ${rows.length} recent questions`:'Ready for your first question';
}
async function refresh(){
 try{
  const res=await fetch(url,{headers:{apikey:key},signal:AbortSignal.timeout(7000)});
  if(!res.ok)throw Error('read failed');
  const data=await res.json();
  if(!Array.isArray(data))throw Error('invalid response');
  const previousId=rows[index]?.id;
  rows=data.filter(r=>r.status==='approved'&&typeof r.message==='string');
  index=Math.max(0,rows.findIndex(r=>r.id===previousId));
  document.querySelector('#warning').textContent='';show();
 }catch{
  // ponytail: hide stale content on a lost connection so the kill switch stays honest.
  rows=[];index=0;show();document.querySelector('#warning').textContent='Connection paused. Reconnecting…';
 }finally{setTimeout(refresh,3000)}
}
function move(step){if(rows.length){index=(index+step+rows.length)%rows.length;show()}}
function togglePause(){paused=!paused;document.querySelector('#pause').textContent=paused?'Resume':'Pause'}
document.querySelector('#previous').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.querySelector('#pause').onclick=togglePause;
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.key===' '){e.preventDefault();togglePause()}if(e.key.toLowerCase()==='b')document.querySelector('#blank').hidden=!document.querySelector('#blank').hidden;if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.().catch(()=>{})});
setInterval(()=>{if(!paused)move(1)},12000);refresh();
</script>
</html>
