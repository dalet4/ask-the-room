<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Ask the room's agent — n8n Leeds</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    padding: 28px 20px 48px;
    background: #15171C;
    color: #E9EBEF;
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 30rem; margin: 0 auto; }
  h1 { font-size: 1.6rem; line-height: 1.15; margin: 0 0 8px; }
  .sub { color: #8A909B; margin: 0 0 28px; }
  label { display: block; font-weight: 600; margin: 0 0 6px; }
  .hint { color: #8A909B; font-size: .88rem; font-weight: 400; margin: 0 0 8px; }
  textarea, input {
    width: 100%;
    background: #1A1D23;
    border: 1px solid #2B303A;
    border-radius: 8px;
    color: inherit;
    font: inherit;
    padding: 12px 14px;
  }
  textarea { min-height: 8rem; resize: vertical; }
  textarea:focus, input:focus { outline: 2px solid #F06E92; outline-offset: 1px; }
  .field { margin: 0 0 24px; }
  button {
    width: 100%;
    background: #CE3A63;
    border: 0;
    border-radius: 8px;
    color: #fff;
    font: 600 1.05rem inherit;
    padding: 15px;
  }
  button[disabled] { opacity: .5; }
  #done { display: none; text-align: center; padding: 40px 0; }
  #done h2 { font-size: 1.4rem; margin: 0 0 8px; }
  #done p { color: #8A909B; margin: 0 0 24px; }
  #again { background: none; border: 1px solid #2B303A; color: #E9EBEF; }
  #error { color: #E5776D; margin: 12px 0 0; }
</style>
</head>
<body>
<main>
  <form id="f">
    <h1>Ask the room's agent</h1>
    <p class="sub">Whatever you type lands on the screen at the front. Tonight it gets built.</p>

    <div class="field">
      <label for="message">Your question or idea</label>
      <textarea id="message" name="message" maxlength="500" required
        placeholder="Ask anything, or tell me what you'd want this thing to do."></textarea>
    </div>

    <div class="field">
      <label for="email">Email <span style="font-weight:400;color:#8A909B">(optional)</span></label>
      <p class="hint">Leave it if you want the finished workflow sent to you at the end. That is the only thing it is used for.</p>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com">
    </div>

    <button type="submit">Send it</button>
    <p id="error" hidden></p>
  </form>

  <div id="done">
    <h2>That's landed.</h2>
    <p>Watch the big screen.</p>
    <button id="again" type="button">Send another</button>
  </div>
</main>

<script>
  // Set at deploy time. Points at the n8n webhook, which moderates before anything is stored.
  const ENDPOINT = "https://n8n.aigentic-ai.co.uk/webhook/room-submit";

  const form = document.getElementById("f");
  const done = document.getElementById("done");
  const err = document.getElementById("error");
  const button = form.querySelector("button");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.hidden = true;
    button.disabled = true;
    button.textContent = "Sending…";
    try {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: form.message.value.trim(),
          email: form.email.value.trim() || null,
        }),
      });
      if (!res.ok) throw new Error(res.status);
      form.style.display = "none";
      done.style.display = "block";
    } catch (_) {
      err.textContent = "That didn't send. Try once more.";
      err.hidden = false;
    } finally {
      button.disabled = false;
      button.textContent = "Send it";
    }
  });

  document.getElementById("again").addEventListener("click", () => {
    form.reset();
    done.style.display = "none";
    form.style.display = "block";
  });
</script>
</body>
</html>
